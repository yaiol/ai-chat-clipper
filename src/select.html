<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="selectPageTitle">Select messages</title>
  <style>
    body {
      font: 13px/1.5 system-ui, sans-serif; color: #222;
      margin: 0; padding: 0;
      /* Defaults - replaced live by select.js when the user picks fonts/size. */
      --preview-title-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --preview-text-font:  -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --preview-text-size:  13px;
    }
    .page { max-width: 880px; margin: 24px auto; padding: 0 24px 60px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .source { color: #6a7280; font-size: 12px; margin: 0 0 16px; }
    .source a { color: #0a6bdc; text-decoration: none; }
    .source a:hover { text-decoration: underline; }

    /* ── Toolbar (sticky, full-width strip; rows centered) ────────── */
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid #eee;
      padding: 8px 0;
    }
    .toolbar .row {
      padding: 0 24px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    }
    .toolbar .actions { display: flex; gap: 6px; align-items: center; }
    /* Selection group sits at the far right of the first row. */
    .toolbar .selection { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
    .select-toggle { width: 16px; height: 16px; margin: 0; cursor: pointer; }
    .toolbar button {
      font: inherit; font-size: 12px; padding: 5px 12px;
      background: #fafafa; border: 1px solid #d0d0d0; color: #444;
      border-radius: 6px; cursor: pointer;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .toolbar button:hover { background: #f0f6ff; border-color: #7eb4ff; color: #111; }
    .toolbar button:focus { outline: 2px solid #4a9eff; outline-offset: 1px; }
    .toolbar .status { color: #6a7280; font-size: 12px; white-space: nowrap; }

    .style-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .style-group label {
      font-size: 12px; color: #444;
    }
    .style-group input[type="checkbox"] { margin: 0; cursor: pointer; }
    .style-group select {
      font: inherit; font-size: 12px; padding: 4px 6px; max-width: 140px;
      background: #fafafa; color: #444; border: 1px solid #d0d0d0; border-radius: 6px;
    }
    .style-group select:hover { background: #f0f6ff; border-color: #7eb4ff; color: #111; }
    .style-group select:focus { outline: 2px solid #4a9eff; outline-offset: 1px; border-color: #4a9eff; }

    .export-buttons { display: flex; gap: 6px; }
    .export-buttons button {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; padding: 0;
      background: #fafafa; border: 1px solid #d0d0d0; color: #444;
      border-radius: 6px; cursor: pointer;
    }
    .export-buttons button:hover { background: #f0f6ff; border-color: #7eb4ff; color: #111; }
    .export-buttons button:disabled { opacity: .4; cursor: default; }
    .export-buttons svg { width: 18px; height: 18px; display: block; }
    /* Slim divider between local-file and cloud-upload groups. */
    .export-buttons .sep {
      width: 1px; height: 22px; background: #e2e2e2; margin: 0 2px; align-self: center;
    }

    /* ── Message list ─────────────────────────────────────────────── */
    .messages { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg {
      display: grid; grid-template-columns: 24px 1fr; gap: 12px;
      padding: 12px 14px; border: 1px solid #e5e5e5; border-radius: 8px;
      background: #fff; transition: background .12s ease, border-color .12s ease;
    }
    .msg:hover { border-color: #b6d8ff; }
    .msg.selected { background: #f0f6ff; border-color: #4a9eff; }
    .msg input[type="checkbox"] { margin: 4px 0 0; cursor: pointer; }

    .msg-head {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      color: #6a7280; margin-bottom: 4px;
    }
    .role {
      display: inline-block; padding: 1px 7px; border-radius: 999px;
      background: #eef6ff; color: #0a4ea8; font-weight: 600;
    }
    .role.assistant { background: #f0f9f0; color: #1f6b1f; }
    .index { color: #9aa1ac; }
    /* Per-message timestamp; hidden unless body has the show-time class. */
    .msg-time {
      color: #9aa1ac; font-size: 11px;
      font-family: var(--preview-text-font);
      letter-spacing: 0; text-transform: none;
    }
    body:not(.show-time) .msg-time { display: none; }
    /* Source line visibility - toggled by the same CSS trick. */
    body:not(.show-source) .source { display: none; }

    /* Live-preview typography - mirrors what the HTML / PDF export will emit. */
    .msg .role { font-family: var(--preview-title-font); }
    .msg-body {
      font-family: var(--preview-text-font);
      font-size: var(--preview-text-size);
      line-height: 1.5; color: #222;
      white-space: pre-wrap; word-wrap: break-word;
      max-height: 220px; overflow: hidden; position: relative;
      cursor: pointer;
    }
    .msg-body.expanded { max-height: none; }
    .msg-body:not(.expanded)::after {
      content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
      background: linear-gradient(transparent, #fff);
      pointer-events: none;
    }
    .msg.selected .msg-body:not(.expanded)::after {
      background: linear-gradient(transparent, #f0f6ff);
    }

    .notice { color: #b00020; font-size: 13px; margin-top: 14px; min-height: 1.4em; }
    .notice.ok { color: #0a7a2f; }
  </style>
</head>
<body>

  <main class="page">
    <h1 id="title" data-i18n="selectHeading">Select messages to export</h1>
    <p class="source" id="source"></p>

    <div id="messages" class="messages"></div>
    <div id="notice" class="notice"></div>
  </main>

  <!-- Load order matters: storage + i18n first, then format helpers, then the page logic. -->

  <script src="lib/download.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/fonts.js"></script>
  <script src="lib/zip.js"></script>
  <script src="lib/md-to-html.js"></script>
  <script src="exporters/markdown.js"></script>

  <script src="exporters/image.js"></script>
  <script src="lib/md-to-notion-blocks.js"></script>
  <script src="exporters/notion.js"></script>
  <script src="exporters/msword.js"></script>
  <script src="exporters/nextcloud.js"></script>
  <script src="lib/export-flow.js"></script>
  <script src="select.js"></script>
</body>
</html>
