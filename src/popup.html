<!doctype html>
<!-- data-icon="yaiol:ai-chat-clipper" -->
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    body { font: var(--ya-font-size)/1.4 var(--ya-font); width: 280px; margin: 0; padding: 14px; color: var(--ya-color-text); }
    /* THREE grids, one per meaning - the row break IS the grouping, so nothing
       straddles two ideas:
         1. plain formats   MD / HTML / TXT / JSON / [debug]        (4, +1 in dev mode)
         2. documents       DOCX / ODT / PDF / PNG                  (4)
         3. cloud uploads   GDocs / Word / OneNote / Notion / Nextcloud  (5)
       ⚠ SIX tiles per row is the maximum - hence 6 columns, which is also what
       row 1 needs to keep the debug button on one line when developer mode turns
       it on. A row with fewer tiles simply leaves the trailing slots empty; do
       NOT narrow the grid to make a row fill, that resizes every tile. The
       visual split mirrors the colour split (grey = downloads, cloud = uploads). */
    /* Copy-to-clipboard row sits above the format grid. Two equal-width
       buttons - Markdown writes text/plain, HTML writes a ClipboardItem
       carrying text/html (+ plain-text fallback) so a single paste into
       Gmail / Docs / Notion / Slack lands as formatted text. */
    .copy-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin-bottom: 8px;
    }
    .copy-row button {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 10px;
      border: 1px solid #d0d0d0; background: #fafafa; color: #444;
      border-radius: 6px; cursor: pointer;
      font: inherit;
      transition: all .12s ease;
    }
    .copy-row button:hover { background: #f0f6ff; border-color: #7eb4ff; color: #111; }
    .copy-row button:disabled { opacity: .5; cursor: default; }
    .copy-row svg { width: 16px; height: 16px; flex-shrink: 0; }
    .export-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .export-grid + .export-grid { margin-top: 6px; }
    .export-grid button {
      display: flex; align-items: center; justify-content: center;
      aspect-ratio: 1 / 1;
      border: 1px solid #d0d0d0; background: #fafafa; color: #444;
      border-radius: 6px; cursor: pointer;
      padding: 0;
      transition: all .12s ease;
    }
    .export-grid button:hover { background: #f0f6ff; border-color: #7eb4ff; color: #111; }
    .export-grid button:disabled { opacity: .5; cursor: default; }
    .export-grid svg { width: 18px; height: 18px; display: block; }
    /* Cloud buttons reuse the standard button frame - the cloud icon
       itself carries the visual distinction (grey cloud, brand-colored
       letter inside). */
    .status { font-size: 12px; color: #666; white-space: pre-wrap; }
    .status:not(:empty) { margin-top: 10px; min-height: 1.4em; }
    .err { color: #b00020; }
    .ok { color: #0a7a2f; }
    h2 { font-size: 12px; font-weight: 600; color: #666; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
    .sites { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .sites a {
      display: flex; align-items: center; justify-content: center;
      aspect-ratio: 1 / 1; border-radius: 6px; border: 1px solid #e5e5e5;
      background: #fff; text-decoration: none; transition: all .12s ease;
    }
    .sites a:hover { background: #f0f6ff; border-color: #7eb4ff; transform: translateY(-1px); }
    .sites a.current { background: #eaf4ff; border-color: #4a9eff; box-shadow: 0 0 0 2px rgba(74,158,255,.2); }
    .sites a img { width: 20px; height: 20px; display: block; object-fit: contain; pointer-events: none; }
    .sites a { cursor: grab; }
    .sites a:active { cursor: grabbing; }
    .sites a.dragging { opacity: .4; }
    .sites a.drag-over { border-color: #4a9eff; box-shadow: inset 0 0 0 2px #4a9eff; }
    .hint { font-size: 11px; color: #888; margin: 6px 0 0; }
    /* The two page buttons (Media / Custom Export) share .copy-row's two-across
       geometry above — same grid, padding, radius, gap and 16px icon. ONLY the
       colour differs (blue accent = "opens a page" vs grey = clipboard), so the
       shape is reused rather than re-invented. */
    .page-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
    .custom-export-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 10px;
      background: #f0f6ff; border: 1px solid #b6d8ff;
      border-radius: 6px; cursor: pointer;
      transition: background .12s ease, border-color .12s ease;
      font: inherit; color: #0a4ea8;
    }
    .custom-export-btn:hover { background: #e0eeff; border-color: #4a9eff; }
    .custom-export-btn:focus { outline: 2px solid #4a9eff; outline-offset: 1px; }
    .custom-export-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .custom-export-btn .ce-title { font-size: 12px; font-weight: 600; }

    /* ── Two swapping views ──────────────────────────────────────────────
       The popup shows one of two full-width views. On a supported AI page the
       EXPORT view is the default and a header toggle (#view-toggle) swaps to
       the site LAUNCHER and back. On an unsupported page there is nothing to
       export, so the export view + toggle are hidden and the launcher is the
       whole popup (body.unsupported). */
    #launcher-view { display: none; }
    body.launcher-open #export-view { display: none; }
    body.launcher-open #launcher-view { display: block; }
    body.unsupported #export-view { display: none; }
    body.unsupported #launcher-view { display: block; }
    body.unsupported #view-toggle { display: none; }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    #view-toggle svg { width: 18px; height: 18px; }
    #view-toggle .icon-back { display: none; }
    body.launcher-open #view-toggle .icon-grid { display: none; }
    body.launcher-open #view-toggle .icon-back { display: block; }

    /* Paginated launcher — fixed rows (LAUNCHER_ROWS in popup.js), page flip.
       Keeps the popup a constant height no matter how many sites ship. */
    .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
    .pager[hidden] { display: none; }
    #page-indicator { font-size: 12px; color: #666; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
    .pager .ya-footer-btn:disabled { opacity: .35; cursor: default; }
    .pager .ya-footer-btn svg { width: 18px; height: 18px; }
    /* Drop a tile on an arrow to send it to that page: armed for the whole drag,
       lit while hovered. Same blue as .sites a.drag-over so both read as one idea. */
    .pager .ya-footer-btn.drag-zone { color: #4a9eff; }
    .pager .ya-footer-btn.drag-over { color: #4a9eff; background: #eaf4ff; box-shadow: 0 0 0 2px #4a9eff; }
  </style>
</head>
